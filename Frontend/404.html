<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self';
             script-src 'self' 'unsafe-inline' https://cloud.umami.is;
             style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
             font-src https://fonts.gstatic.com;
             img-src 'self' https: data: blob:;
             connect-src 'self' https:;">
    <script defer="" src="https://cloud.umami.is/script.js" data-website-id="68937952-fbe5-46ee-80a5-423952323fe3"></script>

    <title>Page not found | Achievely</title>
    <meta name="description" content="This page doesn't exist on Achievely. Head back to the home page or browse the game library.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="application-name" content="Achievely">
    <meta name="theme-color" content="#00d4ff">
    <meta name="color-scheme" content="dark">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=DM+Sans:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">

    <!-- Absolute paths: a 404 can be served from any URL depth -->
    <link rel="stylesheet" href="/styles/shared.css">
    <link rel="icon" type="image/png" sizes="196x196" href="/icons/favicon-196.png">
    <link rel="apple-touch-icon" href="/icons/apple-icon-180.png">

    <style>
      /* ── 404 page ─────────────────────────────────────────── */
      body { position: relative; }

      /* Atmosphere: one soft orb + faint scanlines, matching the landing page mood */
      .nf-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(60% 50% at 50% 38%, rgba(0, 212, 255, 0.10), transparent 70%),
          radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
      }

      .nf-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 3px,
          rgba(0, 212, 255, 0.025) 3px,
          rgba(0, 212, 255, 0.025) 4px
        );
      }

      .nf {
        position: relative;
        z-index: 1;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: calc(var(--nav-h) + var(--sp-xl)) var(--sp-lg) var(--sp-2xl);
      }

      /* ── The numerals: 4 [locked ring] 4 ── */
      .nf__code {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.06em;
        font-family: var(--font-display);
        font-size: clamp(120px, 26vw, 230px);
        line-height: 0.82;
        letter-spacing: 0.02em;
        color: var(--text-primary);
        user-select: none;
      }

      .nf__digit {
        text-shadow: 0 0 38px var(--cyan-glow), 0 0 90px rgba(0, 212, 255, 0.18);
        background: linear-gradient(180deg, #ffffff 10%, var(--cyan) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 22px rgba(0, 212, 255, 0.35));
      }

      .nf__ring {
        width: 0.7em;
        height: 0.7em;
        flex-shrink: 0;
        overflow: visible;
        filter: drop-shadow(0 0 14px rgba(0, 212, 255, 0.5));
      }

      .nf__ring-track {
        fill: rgba(0, 212, 255, 0.04);
        stroke: rgba(0, 212, 255, 0.14);
        stroke-width: 3;
      }

      .nf__ring-line {
        fill: none;
        stroke: var(--cyan);
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-dasharray: 289;
        stroke-dashoffset: 289;
        transform: rotate(-90deg);
        transform-origin: 50px 50px;
        animation: ringDraw 1.3s cubic-bezier(0.4, 0, 0.2, 1) 0.15s forwards;
      }

      .nf__lock {
        fill: none;
        stroke: var(--cyan);
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .nf__lock-body { fill: rgba(0, 212, 255, 0.12); }

      .nf__shackle {
        transform-box: fill-box;
        transform-origin: 100% 100%;
        animation: shackleOpen 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 1.55s forwards;
      }

      @keyframes ringDraw { to { stroke-dashoffset: 0; } }

      @keyframes shackleOpen {
        to { transform: translateY(-5px) rotate(24deg); }
      }

      /* ── Message ── */
      .nf__title {
        margin-top: var(--sp-lg);
        font-family: var(--font-display);
        font-weight: 400;
        font-size: clamp(30px, 6vw, 44px);
        letter-spacing: 0.06em;
        line-height: 1.05;
        color: var(--text-primary);
      }

      .nf__text {
        margin-top: var(--sp-md);
        max-width: 440px;
        font-size: 15px;
        color: var(--text-secondary);
      }

      .nf__path {
        display: inline-block;
        max-width: 100%;
        margin-top: var(--sp-md);
        padding: 4px 12px;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-muted);
        background: rgba(13, 30, 53, 0.7);
        border: 1px solid var(--cyan-border);
        border-radius: var(--r-pill);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: bottom;
      }

      .nf__actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: var(--sp-md);
        margin-top: var(--sp-xl);
      }

      /* ── Achievement card ── */
      .nf-ach {
        display: flex;
        align-items: center;
        gap: var(--sp-md);
        width: 100%;
        max-width: 420px;
        margin-top: var(--sp-2xl);
        padding: var(--sp-md);
        text-align: left;
        border-color: var(--gold-border);
        box-shadow: 0 0 0 1px rgba(255, 209, 102, 0.06), 0 12px 40px rgba(0, 0, 0, 0.35);
        opacity: 0;
        transform: translateY(24px);
        animation: achIn 0.55s cubic-bezier(0.34, 1.4, 0.64, 1) 1.1s forwards;
      }

      .nf-ach__icon {
        position: relative;
        width: 52px;
        height: 52px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--gold);
        background: rgba(255, 209, 102, 0.07);
        border: 1px solid var(--gold-border);
        border-radius: var(--r-md);
      }

      .nf-ach__icon svg { width: 24px; height: 24px; }

      .nf-ach__body { flex: 1; min-width: 0; }

      .nf-ach__head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--sp-sm);
      }

      .nf-ach__name {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .nf-ach__desc {
        margin-top: 2px;
        font-size: 12px;
        color: var(--text-secondary);
      }

      .nf-ach__foot {
        display: flex;
        align-items: center;
        gap: var(--sp-sm);
        margin-top: var(--sp-sm);
      }

      .nf-ach__foot .progress-bar { flex: 1; }

      .nf-ach__foot .progress-bar__fill {
        width: 0;
        background: linear-gradient(90deg, #e0a93a, var(--gold));
        box-shadow: 0 0 6px rgba(255, 209, 102, 0.45);
        animation: achFill 0.9s ease 1.6s forwards;
      }

      .nf-ach__pct {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--gold);
        white-space: nowrap;
      }

      @keyframes achIn { to { opacity: 1; transform: translateY(0); } }
      @keyframes achFill { to { width: 100%; } }

      /* ── Footer fallback (replaced by shared.js when it renders) ── */
      .nf-footer { position: relative; z-index: 1; }

      /* ── Small screens ── */
      @media (max-width: 480px) {
        .nf { padding-left: var(--sp-md); padding-right: var(--sp-md); }
        .nf__actions { flex-direction: column; width: 100%; max-width: 280px; }
        .nf__actions .btn { width: 100%; justify-content: center; }
        .nf-ach { margin-top: var(--sp-xl); }
      }

      /* ── Reduced motion: show the final state immediately ── */
      @media (prefers-reduced-motion: reduce) {
        .nf__ring-line { animation: none; stroke-dashoffset: 0; }
        .nf__shackle { animation: none; transform: translateY(-5px) rotate(24deg); }
        .nf-ach { animation: none; opacity: 1; transform: none; }
        .nf-ach__foot .progress-bar__fill { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>

    <div class="nf-bg" aria-hidden="true"></div>

    <!-- Navbar (shared.js replaces this with the full navbar; this is the fallback) -->
    <header class="navbar" role="banner">
      <a href="/" class="navbar__logo" aria-label="Achievely home">
        <svg viewBox="0 0 24 24" fill="none" stroke="#00d4ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="8 21 12 17 16 21"></polyline>
          <path d="M5 3H19"></path>
          <path d="M5 3C5 3 5 10 12 10 19 10 19 3 19 3"></path>
          <path d="M5 3H3a2 2 0 0 0-2 2v1a4 4 0 0 0 4 4h1"></path>
          <path d="M19 3h2a2 2 0 0 1 2 2v1a4 4 0 0 1-4 4h-1"></path>
          <line x1="12" y1="17" x2="12" y2="10"></line>
        </svg>
        <span class="navbar__logo-text">ACHIEVELY</span>
      </a>
    </header>

    <main class="nf">

      <!-- 4 [locked ring] 4 -->
      <div class="nf__code" role="img" aria-label="Error 404">
        <span class="nf__digit" aria-hidden="true">4</span>
        <svg class="nf__ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="nf__ring-track" cx="50" cy="50" r="46"></circle>
          <circle class="nf__ring-line" cx="50" cy="50" r="46"></circle>
          <g class="nf__lock">
            <rect class="nf__lock-body" x="33" y="48" width="34" height="26" rx="5"></rect>
            <path class="nf__shackle" d="M40 48V40a10 10 0 0 1 20 0v8"></path>
            <circle cx="50" cy="61" r="2.2" fill="#00d4ff" stroke="none"></circle>
          </g>
        </svg>
        <span class="nf__digit" aria-hidden="true">4</span>
      </div>

      <h1 class="nf__title">Page not found</h1>

      <p class="nf__text">
        This page doesn't exist or has been moved. Check the link for typos, or
        pick up from one of the pages below.
      </p>

      <span class="nf__path text-mono" id="nf-path" title="Requested address">/</span>

      <div class="nf__actions">
        <a href="/" class="btn btn--lg">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span>Back to home</span>
        </a>
        <a href="/library.html" class="btn btn--lg btn--ghost">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
          <span>Browse library</span>
        </a>
      </div>

      <!-- Achievement popup: the one playful moment -->
      <div class="card nf-ach" aria-label="Achievement unlocked: Wrong turn">
        <div class="nf-ach__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="9 12.5 11.2 14.7 15.5 9.5"></polyline>
          </svg>
        </div>
        <div class="nf-ach__body">
          <div class="nf-ach__head">
            <span class="nf-ach__name">Wrong turn</span>
            <span class="tag tag--gold">Ultra rare</span>
          </div>
          <p class="nf-ach__desc">Follow a link to a page that doesn't exist.</p>
          <div class="nf-ach__foot">
            <div class="progress-bar" role="presentation"><div class="progress-bar__fill"></div></div>
            <span class="nf-ach__pct">0.04%</span>
          </div>
        </div>
      </div>

    </main>

    <!-- Footer (shared.js replaces this with the full footer; this is the fallback) -->
    <footer class="footer nf-footer" role="contentinfo">
      <span class="footer__copy">&copy; Achievely</span>
    </footer>

    <script>
      // Show the address that wasn't found (textContent keeps it safe from injection)
      (function () {
        var el = document.getElementById('nf-path');
        if (!el) return;
        var p = (location.pathname || '/') + (location.search || '');
        el.textContent = p;
        el.title = p;
      })();

      window.ACHIEVELY_API = window.ACHIEVELY_API || '/api/v1';
    </script>
    <script src="/scripts/shared.js"></script>
  </body>
</html>
