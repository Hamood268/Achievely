<body>

  <!-- Navbar (rendered by shared.js) -->
  <header class="navbar" role="banner"></header>

  <main class="calendar-page">

    <!-- ══════════════════════════════════════
         PAGE HEADING
    ══════════════════════════════════════ -->
    <div class="calendar-heading">
      <h1 class="calendar-heading__title">
        <span class="section-title__accent" aria-hidden="true"></span>
        Release Calendar
      </h1>
      <p class="calendar-heading__subtitle">See exactly which day your most-anticipated games launch.</p>
    </div>

    <!-- ══════════════════════════════════════
         MONTH NAVIGATOR
    ══════════════════════════════════════ -->
    <div class="month-nav" role="group" aria-label="Change month">
      <button type="button" id="month-prev" class="month-nav__arrow" aria-label="Previous month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <div class="month-nav__label" id="month-label" aria-live="polite">October 2026</div>

      <button type="button" id="month-next" class="month-nav__arrow" aria-label="Next month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <!-- ══════════════════════════════════════
         CALENDAR GRID
    ══════════════════════════════════════ -->
    <div class="calendar-wrap">
      <div class="calendar-weekdays" aria-hidden="true">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>

      <div id="calendar-grid" class="calendar-grid" role="list" aria-label="Days of the month">
        <!-- Populated by calendar.js -->
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="footer" role="contentinfo"></footer>

  <script>
    window.ACHIEVELY_API = window.ACHIEVELY_API || '/api/v1';
  </script>
  <script src="./scripts/shared.js"></script>
  <script src="./scripts/calendar.js"></script>

</body>
